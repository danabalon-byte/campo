name: Clima diario Chincolco (ET0, grados día, heladas, pronóstico)
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC (~08:17 hora de Chile)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar ET0 y actualizar archivos
        run: python3 et0/actualizar.py
      - name: Descargar grados día y heladas
        run: python3 clima/actualizar.py
      - name: Guardar temperatura y clima diario en el CSV (no detiene el flujo si falla)
        continue-on-error: true
        run: python3 clima/diario.py
      - name: Guardar pronóstico Open-Meteo (no detiene el flujo si falla)
        continue-on-error: true
        run: python3 pronostico/actualizar.py
      - name: Registrar la semana de ET0 (proyección inicial y actual) (no detiene el flujo si falla)
        continue-on-error: true
        run: python3 pronostico/semanas.py
      - name: Guardar cambios
        run: |
          git config user.name "et0-bot"
          git config user.email "et0-bot@users.noreply.github.com"
          git add et0/chincolco.json et0/chincolco-resumen.json clima/chincolco-gd.json clima/chincolco-heladas.json clima/chincolco-diario.csv
          git add pronostico/openmeteo.csv pronostico/resumen.json pronostico/semanas.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos: clima diario Chincolco $(date -u +%F)"
          git push
